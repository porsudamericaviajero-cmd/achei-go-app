<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D1F"/>
      <stop offset="100%" stop-color="#081810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C950"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255, 107, 43, 0.3)" stroke-width="6"/>

  <!-- Glowing Search Pin Symbol -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Map Pin Background -->
    <path d="M 216 48 C 136 48 72 112 72 192 C 72 296 216 424 216 424 C 216 424 360 296 360 192 C 360 112 296 48 216 48 Z" fill="url(#accent)"/>
    
    <!-- Inner White Circle -->
    <circle cx="216" cy="192" r="76" fill="#FFFFFF"/>
    
    <!-- Pin Store Icon -->
    <path d="M 172 176 L 180 152 L 252 152 L 260 176 Z M 168 186 L 264 186 L 264 228 C 264 234 258 240 252 240 L 180 240 C 174 240 168 234 168 228 Z" fill="#0F2D1F"/>
    
    <!-- WhatsApp green dot indicator -->
    <circle cx="310" cy="100" r="32" fill="url(#green)" stroke="#0F2D1F" stroke-width="8"/>
    <path d="M 302 92 C 302 88 305 85 309 85 C 313 85 316 88 316 92 C 316 98 321 102 327 102 C 330 102 333 105 333 109 C 333 115 322 124 302 108 Z" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="470" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    ACHEI AQUI <tspan fill="#FF6B2B">GO</tspan>
  </text>
</svg>
